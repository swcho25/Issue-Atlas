# self-hosted GitLab이므로 Cloudflare Git 연동 대신 기존 Runner에서 배포한다.
frontend-worker:
  extends: .frontend-browser
  stage: image
  rules: !reference [.frontend-build-scope, rules]
  script:
    - pnpm --filter frontend worker:build
    - pnpm --filter frontend exec wrangler deploy --dry-run --env "$WORKER_ENV"
    - node --check deploy/frontend/verify.mjs
    - pnpm --filter frontend worker:test
  cache:
    - key: { files: [pnpm-lock.yaml] }
      paths: [.pnpm-store]
    - key: { prefix: "next-worker-$WORKER_ENV", files: [pnpm-lock.yaml, frontend/next.config.ts] }
      paths: [frontend/.next/cache/]
  artifacts:
    paths: [frontend/.open-next/]
    expire_in: 1 day

frontend-deploy:
  extends: .frontend-browser
  rules: !reference [.frontend-release, rules]
  stage: deploy
  needs:
    - job: frontend-worker
      artifacts: true
    - job: backend-deploy
      artifacts: false
      optional: true
  resource_group: issueatlas-workers-$CI_COMMIT_BRANCH
  environment:
    name: ${WORKER_ENV}-workers
    url: $FRONTEND_URL
  interruptible: false
  timeout: 15 minutes
  cache:
    key: { files: [pnpm-lock.yaml] }
    paths: [.pnpm-store]
    policy: pull
  script:
    - test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"
    - |
      if [ "$CI_PIPELINE_SOURCE" = "web" ]; then
        current_sha=$(git ls-remote --exit-code origin "refs/heads/$CI_COMMIT_BRANCH" | cut -f1)
        if [ "$current_sha" != "$CI_COMMIT_SHA" ]; then
          echo "Branch advanced. Start a new frontend redeployment from the latest branch."
          exit 1
        fi
      fi
    - pnpm --filter frontend worker:deploy --env "$WORKER_ENV" --var "DEPLOYMENT_REVISION:$CI_COMMIT_SHA"
    - node deploy/frontend/verify.mjs "$FRONTEND_URL" "$CI_COMMIT_SHA"
