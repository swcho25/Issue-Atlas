.release:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^(develop|main)$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never

backend-image:
  extends: .release
  stage: image
  image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  services:
    - name: docker:29.9.2-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
      alias: docker
  variables:
    BACKEND_IMAGE_REPOSITORY: swcho25/issueatlas-backend
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_PUSH_TOKEN"
    - echo "$DOCKERHUB_PUSH_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker build --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" --label "org.opencontainers.image.source=$CI_PROJECT_URL" -t "$BACKEND_IMAGE_REPOSITORY:$CI_COMMIT_SHA" backend
    - docker push "$BACKEND_IMAGE_REPOSITORY:$CI_COMMIT_SHA"
    - docker inspect --format '{{index .RepoDigests 0}}' "$BACKEND_IMAGE_REPOSITORY:$CI_COMMIT_SHA" > backend-image.txt
  artifacts:
    paths: [backend-image.txt]
    expire_in: 7 days

backend-deploy:
  extends: .release
  variables:
    BACKEND_IMAGE_REPOSITORY: swcho25/issueatlas-backend
  stage: deploy
  image: python:3.13-slim-bookworm@sha256:e32be0e55814a08977501ca863271d9bd02443710db8f2afaf8372e2c4508530
  needs:
    - job: backend-image
      artifacts: true
  # main과 develop을 반드시 같은 그룹/환경으로 묶는다.
  resource_group: issueatlas-ec2
  environment:
    name: shared-ec2
    url: https://backend.issue-atlas.kr
  interruptible: false
  timeout: 25 minutes
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends openssh-client ca-certificates
  script:
    - python deploy/ci/send_deploy.py
