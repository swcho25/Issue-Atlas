name: ${COLLECTOR_PROJECT_NAME:-issueatlas-collector}

services:
  collector:
    image: ${COLLECTOR_IMAGE:?Deploy a collector digest first}
    profiles: [manual]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=128m,mode=1777"]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    volumes:
      - type: bind
        source: ${COLLECTOR_ENV_FILE:?Select the collector environment file}
        target: /app/.env
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${COLLECTOR_INPUT_DIR:?Select the collector input directory}
        target: /inputs
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${COLLECTOR_OUTPUT_DIR:?Select the collector output directory}
        target: /app/outputs
        bind: {create_host_path: false}
    networks: [database]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  database:
    external: true
    name: ${COLLECTOR_NETWORK:?Select the database network}
