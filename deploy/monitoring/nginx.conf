# Included by nginx.conf inside http {}. Grafana alone is public; metrics stay private.
map $http_upgrade $issueatlas_grafana_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name grafana.issue-atlas.kr;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/issueatlas-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://grafana.issue-atlas.kr$request_uri; }
}

server {
    listen 443 ssl;
    server_name grafana.issue-atlas.kr;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/grafana.issue-atlas.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.issue-atlas.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $issueatlas_grafana_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
