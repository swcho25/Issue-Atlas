name: ${COMPOSE_PROJECT_NAME:-issueatlas-dev}

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: issueatlas-postgres:17-3.5-pgvector-0.8.7
    build:
      context: ../../database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 2g
    logging: *bounded-logging

  backend:
    image: issueatlas-backend:dev
    build:
      context: ../../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?DB_NAME required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    networks:
      default:
        aliases: ["${BACKEND_NETWORK_ALIAS:-issueatlas-development-backend}"]
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 12
    mem_limit: 2g
    logging: *bounded-logging

volumes:
  postgres-data:
