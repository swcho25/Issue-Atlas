name: ${COMPOSE_PROJECT_NAME:-issueatlas-dev}

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: issueatlas-postgres:17-3.5-pgvector-0.8.7
    build:
      context: ../../database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 2g
    logging: *bounded-logging

  backend:
    image: issueatlas-backend:dev
    build:
      context: ../../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?DB_NAME required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_PORT: "8080"
      # 별도 내부 포트만 Prometheus에 제공. 호스트에는 publish하지 않는다.
      MONITORING_ENABLED: "true"
      MONITORING_PORT: "9091"
      # 논증 문장화 engine 주소. 비우면 부르지 않고 카드 문구로 응답한다(ENGINE_DISABLED).
      # 켤 때 .env 에 http://engine:8000 (익명 질문 요청 수 제한이 배포된 뒤)
      ENGINE_URL: ${ENGINE_URL:-}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    networks:
      default:
        aliases: ["${BACKEND_NETWORK_ALIAS:-issueatlas-development-backend}"]
      engine: {}
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 12
    mem_limit: 2g
    logging: *bounded-logging

  # 논증 문장화 API (engine/api, S15P31C108-243). backend 만 engine 네트워크로 부른다.
  # 호스트 포트를 열지 않고 DB 네트워크(default)에도 붙지 않는다. GMS 호출을 위해 외부로 나가는 길만 있다.
  engine:
    image: issueatlas-engine:dev
    build:
      context: ../..
      dockerfile: engine/Dockerfile
      target: api
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m,mode=1777"]
    environment:
      TZ: UTC
    volumes:
      # GMS_API_KEY 만 든 서버 파일. 환경변수·이미지·저장소에 키를 넣지 않는다.
      - type: bind
        source: ${ENGINE_ENV_FILE:-/etc/issueatlas/engine.env}
        target: /app/.env
        read_only: true
        bind: {create_host_path: false}
    networks: [engine]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    logging: *bounded-logging

networks:
  engine: {}

volumes:
  postgres-data:
