<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>지도 장면 굽기</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css">
<style>
  body { margin: 0; font: 13px monospace; }
  #log { position: fixed; top: 0; left: 0; z-index: 2; background: #fff; padding: 8px; white-space: pre; }
  /* 정사각형으로 굽는다: 랜딩에서 기울이고 돌려도 모서리가 덜 보인다 */
  #m { width: 2048px; height: 2048px; }
</style>
</head>
<body>
<div id="log">준비 중…</div>
<div id="m"></div>
<script>
  // 창이 숨어 있으면 requestAnimationFrame 이 멈춰 지도 스타일조차 읽지 않는다 — 타이머로 대신 돈다
  window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16);
  window.cancelAnimationFrame = (id) => clearTimeout(id);
</script>
<script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
<script>
// 도착 지역 한가운데를 중심으로 확대만 다르게 구운 장면들. 랜딩에서 안쪽(선명한) 장면을 바깥 장면 위에 겹쳐 그린다
//   ?style=blue|fiord   ?z=11.5,12.5 (몇 장만 다시)   ?at=seoul (서울 중심, 파일 이름에 -seoul) · 없으면 광주
const qs = new URLSearchParams(location.search), STYLE = qs.get("style") || "blue";
const AT = { seoul: { c: [126.98, 37.56], tag: "seoul-" }, gwangju: { c: [126.85, 35.16], tag: "" } }[qs.get("at") || "gwangju"];
const C = AT.c, SIDE = 2048;
const LEVELS = qs.get("z") ? qs.get("z").split(",").map(Number) : [4.5, 6, 7.5, 9, 10.5, 11.5, 12.5];
const log = (s) => (document.getElementById("log").textContent += "\n" + s);
const wait = (ms) => new Promise((ok) => setTimeout(ok, ms));

// 밝은 남색 지도: positron 의 회색을 밝기에 따라 남색(#2E4A7D) ~ 흰색 사이로 옮겨 칠한다
const ink = document.createElement("canvas").getContext("2d");
const parse = (s) => { ink.fillStyle = "#010203"; ink.fillStyle = s; const v = ink.fillStyle; if (v === "#010203") return null;
  if (v[0] === "#") return [1, 3, 5].map((i) => parseInt(v.slice(i, i + 2), 16)).concat(1);
  const n = v.match(/[\d.]+/g).map(Number); return [n[0], n[1], n[2], n[3] ?? 1]; };
const NAVY = [46, 74, 125];
const tone = (s) => { const c = parse(s); if (!c) return s; const t = Math.pow((0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255, 1.15);
  const k = (i) => Math.round(NAVY[i] + (255 - NAVY[i]) * t); return `rgba(${k(0)},${k(1)},${k(2)},${c[3]})`; };
const walk = (v) => (typeof v === "string" ? tone(v) : Array.isArray(v) ? v.map((x, i) => (i === 0 ? x : walk(x))) : v);
const paint = (style, id, props) => { const l = style.layers.find((x) => x.id === id); if (l) Object.assign((l.paint ??= {}), props); };

async function buildStyle() {
  // blue = positron 을 남색 톤으로 다시 칠한 것. 그 밖(liberty · bright …)은 OpenFreeMap 테마 그대로
  const style = await (await fetch(`https://tiles.openfreemap.org/styles/${STYLE === "blue" ? "positron" : STYLE}`)).json();
  // 글자는 굽지 않는다(랜딩에서 글자로 따로 얹는다)
  style.layers = style.layers.filter((l) => l.type !== "symbol");
  let relief;
  if (STYLE === "blue") {
    for (const l of style.layers) for (const k of Object.keys(l.paint || {})) if (k.endsWith("-color")) l.paint[k] = walk(l.paint[k]);
    paint(style, "water", { "fill-color": "#c3d4ee" });
    paint(style, "waterway", { "line-color": "#b2c7e8" });
    paint(style, "park", { "fill-color": "#e3ebf6" });
    paint(style, "boundary_3", { "line-color": "#7d92bc" });
    relief = { "hillshade-shadow-color": "#6d84ad", "hillshade-highlight-color": "#ffffff", "hillshade-accent-color": "#a5b5d2", "hillshade-exaggeration": 0.32 };
  } else {
    relief = { "hillshade-shadow-color": "#6f7b8c", "hillshade-highlight-color": "#ffffff", "hillshade-accent-color": "#a9b2bf", "hillshade-exaggeration": 0.3 };
  }
  style.sources.dem = { type: "raster-dem", tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"], tileSize: 256, encoding: "terrarium", maxzoom: 11 };
  const at = style.layers.findIndex((l) => /^(waterway|building|tunnel|highway|road|railway|boundary|aeroway)/.test(l.id));
  style.layers.splice(at < 0 ? style.layers.length : at, 0, { id: "relief", type: "hillshade", source: "dem", paint: relief });
  return style;
}

// 창이 숨어 있어도 직접 그려서 타일 요청을 밀어 준다
const settle = async (map) => { for (let i = 0; i < 320; i++) { map.redraw(); if (map.isStyleLoaded() && map.getLayer("relief") && map.areTilesLoaded()) { await wait(300); map.redraw(); if (map.areTilesLoaded()) return; } await wait(250); } log("시간 초과"); };
const save = async (map, name) => { map.redraw(); const blob = await new Promise((ok) => map.getCanvas().toBlob(ok, "image/webp", 0.86)); const r = await fetch("/save/" + name, { method: "POST", body: blob }); log((await r.text()) + " " + Math.round(blob.size / 1024) + "KB"); };

(async () => {
  const map = new maplibregl.Map({ container: "m", style: await buildStyle(), center: C, zoom: LEVELS[0], interactive: false, attributionControl: false, pixelRatio: 1, fadeDuration: 0, canvasContextAttributes: { preserveDrawingBuffer: true } });
  for (const z of LEVELS) { map.jumpTo({ center: C, zoom: z }); await settle(map); await save(map, `${STYLE}-${AT.tag}${z}.webp`); }
  log("끝");
  window.__done = true;
})().catch((e) => { log("오류 " + e.message); window.__done = "error"; });
</script>
</body>
</html>
