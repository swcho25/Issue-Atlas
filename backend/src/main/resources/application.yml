spring:
  application:
    name: issue-atlas-backend
  datasource:
    # 기본값은 루트 docker-compose.yml(PostGIS)에 맞춘 로컬 값. 배포 값은 환경 변수로 덮어쓴다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/issue_atlas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션만 바꾼다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
