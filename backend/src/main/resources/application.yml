spring:
  application:
    name: issue-atlas-backend
  datasource:
    # 기본값은 루트 docker-compose.yml(PostGIS)에 맞춘 로컬 값. 배포 값은 환경 변수로 덮어쓴다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/issue_atlas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 마이그레이션만 바꾼다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jackson:
    # C2 계약과 같은 snake_case (place_id, is_active …)
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:8080}
  # 2KB 넘는 JSON 응답을 gzip (경계 GeoJSON 여수 약 175KB). 브라우저가 Accept-Encoding 을 보낼 때만
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # 배포 환경(https)에서는 true. 로컬 http 에서는 false 여야 브라우저가 쿠키를 저장한다.
        secure: ${SESSION_COOKIE_SECURE:false}

issue-atlas:
  monitoring:
    enabled: ${MONITORING_ENABLED:false}
    port: ${MONITORING_PORT:9091}
  engine:
    # 논증 문장화 engine 주소(contracts/ai v0.2 「문장화」, 예: http://127.0.0.1:8000). 비우면 부르지 않고
    # 카드 문구로 응답한다(argument_phrasing 사유 ENGINE_DISABLED). 응답 대기는 engine 모델 제한(30초)보다 조금 길게.
    url: ${ENGINE_URL:}
    timeout: ${ENGINE_TIMEOUT:40s}
    # 같은 문장화 입력(run_id · question_id 제외)의 done 결과를 서버 메모리에 담아 다시 쓴다(S15P31C108-261).
    # 크기 0 이면 끈다. engine 프롬프트 · 모델을 바꾼 뒤 바로 반영하려면 backend 를 다시 띄운다.
    cache-size: ${ENGINE_CACHE_SIZE:500}
    cache-ttl: ${ENGINE_CACHE_TTL:24h}
  admin:
    # 첫 관리자. 둘 다 있고 같은 이메일이 없을 때만 한 번 만든다. 값은 환경 변수로만 준다.
    email: ${ADMIN_EMAIL:}
    password: ${DB_PASSWORD}
  questions:
    # 익명 질문 한도(IP 당 분당). 넘으면 429 TOO_MANY_REQUESTS
    per-minute: ${QUESTIONS_PER_MINUTE:10}

springdoc:
  swagger-ui:
    # Try it out 의 POST 에 XSRF-TOKEN 쿠키 값을 X-XSRF-TOKEN 헤더로 붙인다
    csrf:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 60s
