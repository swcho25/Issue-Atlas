openapi: 3.1.0
info:
  title: Issue Atlas API (C2)
  version: 0.1.0
  description: |
    C2 API 응답 계약 v0.1 초안. backend(P7) → frontend.
    성공 응답만 정한다. 오류는 contracts/http-errors (application/problem+json).
    응답 본문의 스키마 원본은 schemas/*.schema.json, 예시는 examples/*.json.
  license:
    name: Internal
    identifier: LicenseRef-Internal
servers:
  - url: /
    description: 같은 출처. 브라우저는 /api/* → Next rewrites → Spring
security: []
tags:
  - name: places
    description: 지역과 지역별 카드 목록
  - name: questions
    description: 질문 저장과 논증 카드
  - name: evidence
    description: 근거 상세와 지도 점
  - name: admin
    description: 관리자 전용 (/v1/admin/**, 조회자는 403)
paths:
  /v1/places:
    get:
      tags: [places]
      operationId: listPlaces
      summary: 지역 목록 (광주 5구·여수, parent_id 를 주면 그 시군구의 행정동)
      parameters:
        - name: parent_id
          in: query
          required: false
          description: 시군구 place_id. 주면 그 아래 행정동(level emd, 코드 sgis)만 돌려준다. 없는 지역이면 404. 행정동은 고른 시군구 안에서 지도 · 기사 범위를 좁히는 내부 선택이고 질문(place_id)은 시군구로 만든다
          schema:
            type: string
      responses:
        "200":
          description: 지역 목록
          content:
            application/json:
              schema:
                $ref: ./schemas/place-list.schema.json
        "4XX":
          $ref: "#/components/responses/Problem"
  /v1/places/{place_id}/cards:
    get:
      tags: [places]
      operationId: listPlaceCards
      summary: 지역의 이슈 카드 목록과 근거 확보 상태 (점수·순위 없음)
      parameters:
        - $ref: "#/components/parameters/PlaceId"
        - $ref: "#/components/parameters/PeriodStart"
        - $ref: "#/components/parameters/PeriodEnd"
      responses:
        "200":
          description: 카드 목록
          content:
            application/json:
              schema:
                $ref: ./schemas/place-cards.schema.json
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/places/{place_id}/boundaries:
    get:
      tags: [places]
      operationId: getPlaceBoundaries
      summary: 지역 경계 GeoJSON (시군구를 주면 그 시군구 + 행정동 경계 한 번에)
      description: |
        지도 테두리 · 행정동 고르기(화면 18a). 시군구 place_id 를 주면 시군구 경계가 먼저, 이어서 그 안 행정동(place_id 순).
        행정동을 주면 그 행정동 하나. 경계가 없는 place(측정소 · 시도)는 빈 features. 없는 place 는 404.
        좌표는 WGS84 [경도, 위도] 소수 5자리(약 1 m). 경계는 SGIS 행정구역 경계를 10 m 단순화한 것(contracts/p3 「경계」).
      parameters:
        - $ref: "#/components/parameters/PlaceId"
      responses:
        "200":
          description: 경계 FeatureCollection
          content:
            application/json:
              schema:
                $ref: ./schemas/place-boundaries.schema.json
        "404":
          $ref: "#/components/responses/Problem"
  /v1/questions:
    get:
      tags: [questions]
      operationId: listMyQuestions
      summary: 내 질문 목록 (로그인 필요, 최근 순). 목 — 지금은 고정 예시 3건
      description: |
        로그인한 사용자가 저장한 질문과 질문마다 마지막 실행. 결과 화면은 run_id 로 GET /v1/arguments/{run_id}.
        목(mock): 질문에 작성자 칸이 아직 없어 누가 불러도 examples/question-list.json 과 같은 3건을 준다(실행 ID 는 argument 예시의 것).
      responses:
        "200":
          description: 내 질문 목록
          content:
            application/json:
              schema:
                $ref: ./schemas/question-list.schema.json
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [questions]
      operationId: createQuestion
      summary: 질문(지역 × 카드 × 기간) 저장 후 실행. card_id 가 null 이면 신규 카드 후보
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/question-create-request.schema.json
      responses:
        "201":
          description: 저장된 질문과 실행 ID
          content:
            application/json:
              schema:
                $ref: ./schemas/question-create-response.schema.json
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          description: 클라이언트 IP(CF-Connecting-IP, 없으면 접속 주소) 당 분당 한도(기본 10, QUESTIONS_PER_MINUTE)를 넘음. 질문 · 실행을 만들지 않는다. code TOO_MANY_REQUESTS (contracts/http-errors v0.3)
          headers:
            Retry-After:
              description: 다시 보내기까지 기다릴 초. 지금은 늘 60
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/arguments/{run_id}:
    get:
      tags: [questions]
      operationId: getArgument
      summary: 근거 수요표 + 논증 카드 6칸
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 논증 결과
          content:
            application/json:
              schema:
                $ref: ./schemas/argument.schema.json
        "404":
          $ref: "#/components/responses/Problem"
  /v1/evidence/{evidence_id}:
    get:
      tags: [evidence]
      operationId: getEvidence
      summary: 근거 상세 (출처 등급·시점·이용 조건·원문·각주)
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 근거 상세
          content:
            application/json:
              schema:
                $ref: ./schemas/evidence.schema.json
        "404":
          $ref: "#/components/responses/Problem"
  /v1/observations:
    get:
      tags: [evidence]
      operationId: listObservations
      summary: 지도 점 (GeoJSON). 좌표 없는 통계 카드는 features 빈 배열
      parameters:
        - name: place_id
          in: query
          required: true
          schema:
            type: string
        - name: card_id
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/PeriodStart"
        - $ref: "#/components/parameters/PeriodEnd"
      responses:
        "200":
          description: 관측점
          content:
            application/json:
              schema:
                $ref: ./schemas/observations.schema.json
        "400":
          $ref: "#/components/responses/Problem"
  /v1/sources:
    get:
      tags: [evidence]
      operationId: listSources
      summary: 출처 목록 — 출처 등급 · 이용 조건 · 저장 범위와 수집 명세별 마지막 성공 수집 시각
      responses:
        "200":
          description: 출처 목록
          content:
            application/json:
              schema:
                $ref: ./schemas/source-list.schema.json
        "4XX":
          $ref: "#/components/responses/Problem"
  /v1/admin/jobs:
    get:
      tags: [admin]
      operationId: listJobs
      summary: 수집 이력 목록 (관리자 전용, FR-F5). 최근 시작 순, 재실행 없음
      parameters:
        - name: status
          in: query
          required: false
          schema: { enum: [running, ok, failed, aborted] }
        - name: source_id
          in: query
          required: false
          schema: { type: string }
        - name: spec_id
          in: query
          required: false
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 수집 이력
          content:
            application/json:
              schema:
                $ref: ./schemas/job-list.schema.json
        "4XX":
          $ref: "#/components/responses/Problem"
  /v1/admin/jobs/{job_run_id}:
    get:
      tags: [admin]
      operationId: getJob
      summary: 수집 실행 1건 (관리자 전용)
      parameters:
        - name: job_run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 수집 실행
          content:
            application/json:
              schema:
                $ref: ./schemas/job.schema.json
        "4XX":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    PlaceId:
      name: place_id
      in: path
      required: true
      schema:
        type: string
    PeriodStart:
      name: period_start
      in: query
      required: true
      description: 기간 시작 (포함)
      schema:
        type: string
        format: date
    PeriodEnd:
      name: period_end
      in: query
      required: true
      description: 기간 끝 (미포함, [start, end))
      schema:
        type: string
        format: date
  responses:
    Problem:
      description: 공통 오류 (contracts/http-errors)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { enum: [INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, RESOURCE_NOT_FOUND, TOO_MANY_REQUESTS, INTERNAL_ERROR, HTTP_ERROR] }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
            required: [field, message]
      required: [type, title, status, detail, instance, code, errors]
