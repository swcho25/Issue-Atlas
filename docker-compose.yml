# 로컬 개발용 데이터 의존성. 팀 전원이 같은 버전을 쓴다.
#
#   pnpm infra:up     기동
#   pnpm infra:down   중지 (데이터는 볼륨에 남음)
#
# 값은 .env 로 덮어쓸 수 있다. 아래는 로컬 전용 기본값이다.
#
# DB 이미지는 digest 로 고정한 PostGIS 기반에 pgvector 를 빌드해 사용한다.
# 기반 이미지를 올릴 때는 database/Dockerfile 의 태그와 digest 를 함께 바꾼다.

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # PostgreSQL 17 + PostGIS 3.5 + pgvector 0.8.7. backend 테스트도 같은 Dockerfile 을 쓴다.
    image: issueatlas-postgres:17-3.5-pgvector-0.8.7
    build:
      context: ./database
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-issue_atlas}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-atlaslocal}
      # 저장은 UTC 로 고정한다. 표시 시간대(KST)는 애플리케이션이 정한다.
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging: *bounded-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-issue_atlas}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
